# ============================================================================
#  Mosquitto 本地联调配置（仅开发用，生产请使用准入平台提供的 Broker）
#
#  启动： docker compose --profile mqtt up -d
#  日志： docker compose logs -f mqtt
#  订阅观察： docker exec -it dssad-mosquitto \
#               mosquitto_sub -h 127.0.0.1 -t '#' -v
# ============================================================================

listener 1883 0.0.0.0
allow_anonymous true

# 持久化：本项目 MQTT 使用 clean_session=false（文档 5.1.1/6.1.1 明确要求），
# Broker 关闭再启动后必须能保留断线期间的会话与消息，否则联调时
# 「断线 → 重连 → 补发」这条链路根本跑不到。
persistence true
persistence_location /mosquitto/data/

# 本地联调打开详细日志，便于核对 QoS 与 Topic
log_dest stdout
log_type all
connection_messages true
