# ============================================================================
#  车路通 DSSAD 云平台 —— Nginx 站点配置
#
#  放置位置（二选一）：
#    容器部署  挂载到容器内 /etc/nginx/conf.d/default.conf（见 docker-compose.prod.yml）
#    主机部署  放到 /etc/nginx/conf.d/dssad-cloud.conf，upstream 改指 127.0.0.1:8080
#
#  改完务必先自检再 reload：
#      nginx -t && nginx -s reload
# ============================================================================

# ---------------------------------------------------------------------------
# 上游：容器部署时容器名即主机名；主机部署改成 127.0.0.1:8080
# ---------------------------------------------------------------------------
upstream dssad_app {
    server app:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# 限流区：登录接口单独限流，防撞库
#   （应用层在 build 时未启用 Spring 限流——见《性能优化与压测报告》F-01，
#     因此**入口层限流是目前唯一真实生效的一道**，不要省略）
# ---------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m   rate=120r/s;

# HTTP → HTTPS
server {
    listen 80;
    server_name _;

    # 健康探针走 HTTP（编排/负载均衡探活，不必绕 TLS）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # -----------------------------------------------------------------------
    # TLS
    #  ⚠️ 证书文件必须**先存在**：目录为空时 Nginx 直接启动失败，
    #     而编排往往已把应用拉起 → 表现为「进程都在跑但网站打不开」。
    #     联调可用自签证书（见部署指南「自签证书」一节）。
    # -----------------------------------------------------------------------
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # 只允许 TLS 1.2+，并显式指定套件（避免弱套件被协商上）
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # -----------------------------------------------------------------------
    # 关键：应用端 forward-headers-strategy=framework 会据 X-Forwarded-* 还原真实域名/协议。
    # 缺了 X-Forwarded-Proto，应用侧会把所有请求判成非安全通道；
    # 若将来开启 require-https，就会与本层的 301 形成**无限重定向循环**。
    # -----------------------------------------------------------------------
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # 上传事故视频等大请求体：文档 9.2 约定单文件 ≤ 200MB，这里留 20m 供管理接口，
    # 媒体上传走 /manager 单独放宽
    client_max_body_size 210m;
    proxy_read_timeout   120s;
    proxy_send_timeout   120s;

    # 若应用已开 server.compression，这里再压一次纯属重复劳动
    gzip off;

    access_log /var/log/nginx/dssad-access.log;
    error_log  /var/log/nginx/dssad-error.log warn;

    # -----------------------------------------------------------------------
    # 前端静态资源（Vue3 构建产物）
    # -----------------------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # 带 hash 的构建产物可长缓存；index.html 绝不缓存，否则发版后用户拿到旧壳
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # 登录接口：单独限流（防撞库）
    # -----------------------------------------------------------------------
    location = /api/v1/auth/login {
        limit_req zone=login_zone burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://dssad_app;
    }

    # -----------------------------------------------------------------------
    # 平台管理接口（前端主用，X-Token 鉴权）
    # -----------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_zone burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://dssad_app;
    }

    # -----------------------------------------------------------------------
    # 对外监管接口（云云 JSON + HMAC 签名，由监管平台服务端调用）
    # -----------------------------------------------------------------------
    location /enterprise/api/ {
        limit_req zone=api_zone burst=200 nodelay;
        proxy_pass http://dssad_app;
    }

    # -----------------------------------------------------------------------
    # 监管平台回调上传（事故视频）
    # -----------------------------------------------------------------------
    location /manager/ {
        client_max_body_size 210m;
        proxy_request_buffering off;
        proxy_pass http://dssad_app;
    }

    # -----------------------------------------------------------------------
    # 媒体直出：由 Nginx 直接服务静态文件，不经过应用层
    # （事故视频是 GB 级流量，走应用转发会白白占用 Tomcat 线程与连接）
    # -----------------------------------------------------------------------
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";
        # 媒体目录仅允许读，禁止目录列举
        autoindex off;
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # Actuator 收敛：只放行健康探针，其余端点直接 404
    #
    # 为什么必须做：/actuator/metrics 与 /actuator/prometheus 会暴露
    # JVM 堆占用、连接池等待数、接口耗时分布 —— 等于一份系统说明书。
    # 注意：应用层同样有来源 IP 白名单（ActuatorIpWhitelistFilter，fail-closed，
    # 配置项 dssad.security.actuator.allowed-cidrs）—— 这里是第一道，应用层是第二道。
    # 两道都要在：Nginx 挡外部，应用层挡「绕过 Nginx 的容器内/同宿主机直连」。
    # ⚠️ 容器化部署时 Nginx 与 app 不在同一网络命名空间，proxy_pass 的源地址是
    #    Nginx 容器 IP（非回环）→ 必须把 Docker 网段加入 allowed-cidrs，
    #    否则这三个 location 会返回 404（docker-compose.prod.yml 已默认配置）。
    # 返回 404（而不是 403）是为了让外部无法判断端点是否存在。
    # -----------------------------------------------------------------------
    location = /actuator/health {
        proxy_pass http://dssad_app;
    }
    location = /actuator/health/liveness {
        proxy_pass http://dssad_app;
    }
    location = /actuator/health/readiness {
        proxy_pass http://dssad_app;
    }
    location /actuator/ {
        return 404;
    }

    # -----------------------------------------------------------------------
    # SPA 兜底：前端 history 路由（/monitor、/events 等）直接刷新时必须回落到 index.html，
    # 否则刷新页面就是 404。必须放在所有 API location 之后。
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
