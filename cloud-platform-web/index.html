<!DOCTYPE html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="车路通 DSSAD 产品云平台 —— 车辆数据接入与运营管理" />
    <title>DSSAD 云平台</title>
  </head>
  <body>
    <div id="app">
      <!-- 首屏骨架：JS 下载/解析期间（弱网下 echarts/element chunk 较大）避免黑屏白板；
           Vue 应用挂载后会整棵替换 #app 内容，无需手动清理 -->
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:#0d1117;color:#8b9bb0;font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;">
        <div style="width:36px;height:36px;border:3px solid #263140;border-top-color:#2f81f7;border-radius:50%;animation:dssad-boot .9s linear infinite;"></div>
        <p style="margin:16px 0 0;font-size:13px;letter-spacing:2px;">DSSAD 云平台加载中…</p>
      </div>
      <style>@keyframes dssad-boot{to{transform:rotate(360deg)}}</style>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
