# ============================================================================
# 生产配置：MySQL + Redis + 真实 MQTT Broker
#
# 启动前必须通过环境变量注入（禁止把口令写进代码或仓库）：
#   DB_HOST / DB_PORT / DB_NAME / DB_USERNAME / DB_PASSWORD
#   REDIS_HOST / REDIS_PORT / REDIS_PASSWORD
#   DSSAD_ENTERPRISE_ID / DSSAD_MQTT_BROKER_URL / DSSAD_REGULATORY_BASE_URL
#   ADMIN_PASSWORD（平台登录口令）
#
# 命令行示例（systemd / Docker 环境变量文件同理）：
#   java -jar dssad-cloud-platform.jar --spring.profiles.active=prod
# ============================================================================
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:dssad_cloud}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=true&rewriteBatchedStatements=true&allowPublicKeyRetrieval=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # 连接数 = (CPU 核数 * 2) + 有效磁盘数，8 核机器取 20 足够；轨迹写入是批量为主
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1200000
      pool-name: dssad-hikari
      # rewriteBatchedStatements=true 是 MySQL 批量插入生效的前提，已在 URL 中开启
  jpa:
    # 生产禁止自动改表：DDL 由 db/schema-mysql.sql 通过发布流程执行
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 500
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 8
          min-idle: 2
  # 虚拟线程（Java 21）：Tomcat 请求处理与 @Async 任务改由虚拟线程承载。
  # 本服务的请求几乎全是 IO 等待型（Hikari 取连接、MySQL 往返、Redis、监管平台 HTTPS），
  # CPU 占用极低 —— 正是虚拟线程的最佳场景：用极小的内存代价换取高并发下的排队消除。
  # 注意：Tomcat 的 max-threads 在虚拟线程模式下成为「不再限制并发」的配置项，
  # 真正的上限变成数据库连接池（maximum-pool-size: 20）—— 连接池成为唯一瓶颈，
  # 这在语义上更正确：以前是线程先排队，现在是连接先排队。
  threads:
    virtual:
      enabled: true

dssad:
  enterprise-id: ${DSSAD_ENTERPRISE_ID}
  enterprise-name: ${DSSAD_ENTERPRISE_NAME:车路通DSSAD云平台}
  # 二级缓存的 TTL 基数：生产多实例部署，L2 承担跨实例一致性
  cache:
    l1-max-size: 50000
    l1-default-ttl-seconds: 30
    l2-default-ttl-seconds: 60
  mqtt:
    # 生产必须为 true，否则平台收不到任何车端/监管数据
    enabled: true
    broker-url: ${DSSAD_MQTT_BROKER_URL}
    username: ${DSSAD_MQTT_USERNAME:${DSSAD_ENTERPRISE_ID}}
    # 留空则由监管平台 /passport/api/v1/auth/access-enterprise-mqtt 动态换取（文档 6.2.2.1.1）
    password: ${DSSAD_MQTT_PASSWORD:}
    subscribe-car-uplink: ${DSSAD_MQTT_SUBSCRIBE_CAR:false}
  regulatory:
    base-url: ${DSSAD_REGULATORY_BASE_URL}
  storage:
    type: ${DSSAD_STORAGE_TYPE:local}
    local-root: ${DSSAD_STORAGE_ROOT:/data/dssad/media}
    public-base-url: ${DSSAD_STORAGE_PUBLIC_URL}
  srs:
    http-base-url: ${DSSAD_SRS_URL}
    app: ${DSSAD_SRS_APP:live}
  redis:
    # 多实例部署必须开启：去重/限流/令牌/最新状态需跨实例共享
    enabled: true
  # 报文注入模拟器：生产环境永久关闭（会凭空生成事故/故障数据，污染监管取证链路）
  simulator:
    enabled: false
  audit:
    # 按存储预算选择；本配置默认采样 5%，事件类报文始终全量留痕
    mode: ${DSSAD_AUDIT_MODE:sampled}
    sample-rate: ${DSSAD_AUDIT_SAMPLE_RATE:0.05}
    retention-days: ${DSSAD_AUDIT_RETENTION_DAYS:180}
  # 遥测流水保留策略：生产**必须**按磁盘容量显式核算后配置（见 docs/db 数据库设计文档的容量估算）。
  # 参考：1000 台车 1Hz 轨迹 ≈ 8640 万行/天 ≈ 14GB/天 → 保留 30 天需约 430GB。
  # 若把 track-point-days 设为 0（不清理），单表会在数周内涨到十亿行，查询与备份都会失效。
  retention:
    track-point-days: ${DSSAD_TRACK_RETENTION_DAYS:90}
    state-snapshot-days: ${DSSAD_STATE_RETENTION_DAYS:180}
    batch-size: ${DSSAD_RETENTION_BATCH_SIZE:5000}
  # Actuator 来源 IP 白名单（fail-closed）：白名单之外一律 404。
  # 生产默认只允许回环，即「只有同机的 Nginx 与编排探针能读到 Actuator」。
  #
  # ⚠️ 若 app 与 Nginx 不在同一网络命名空间（docker compose / K8s），
  #    Nginx 转发探活的源地址是容器/节点 IP，**不是回环地址** ——
  #    必须把对应网段加进来，否则网关侧的 /actuator/health 会拿到 404，
  #    而应用日志里只会留下一行「拒绝访问 Actuator」的 WARN。
  #    docker-compose.prod.yml 已按此默认配置；K8s 用 10.0.0.0/8 之类的节点网段。
  #
  # 留空（allowed-cidrs 设为空）表示彻底关闭 Actuator 的 HTTP 访问 ——
  # 此时存活判定改用业务端点 /api/v1/monitor/health-check。
  security:
    actuator:
      allowed-cidrs: ${DSSAD_ACTUATOR_ALLOWED_CIDRS:127.0.0.1/32,::1/128}

logging:
  level:
    root: WARN
    com.genvict.dssad.cloud: INFO
  file:
    name: ${DSSAD_LOG_DIR:/var/log/dssad}/dssad-cloud-platform.log
  logback:
    rollingpolicy:
      max-file-size: 200MB
      max-history: 30
      total-size-cap: 10GB
